<!--
  Sampaguita — five white petals on the app's accent blue.
  Deliberately blunt: a favicon is read at 16px, so shapes are big and the
  contrast is high. Kept as SVG (not .ico) so it stays sharp on every screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#3b6cf5"/>
  <g fill="#ffffff">
    <circle cx="16"    cy="9"     r="5.1"/>
    <circle cx="22.66" cy="13.84" r="5.1"/>
    <circle cx="20.11" cy="21.66" r="5.1"/>
    <circle cx="11.89" cy="21.66" r="5.1"/>
    <circle cx="9.34"  cy="13.84" r="5.1"/>
  </g>
  <circle cx="16" cy="16" r="3.4" fill="#ffd66b"/>
</svg>
